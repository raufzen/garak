<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="garak - LLM vulnerability scanner & Generative AI Red-teaming kit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0507"/>
      <stop offset="50%" stop-color="#140a10"/>
      <stop offset="100%" stop-color="#0c0714"/>
    </linearGradient>
    <radialGradient id="glow-red" cx="20%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#271822" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow-red)"/>
  <rect width="1280" height="420" fill="url(#glow-purple)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- Top bar -->
  <line x1="60" y1="50" x2="1220" y2="50" stroke="#261b24" stroke-width="1.5"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#715c6d">GITHUB.COM / RAUFZEN / GARAK</text>
  <text x="1220" y="38" text-anchor="end" font-family="monospace" font-size="13" font-weight="600" fill="#f87171">GENAI RED-TEAMING &amp; AUDIT</text>

  <!-- Center Card -->
  <g transform="translate(60, 90)">
    <!-- Security Shield Icon -->
    <g transform="translate(0, 15)">
      <rect width="90" height="90" rx="20" fill="#180b14" stroke="#4a1d2d" stroke-width="2" filter="url(#glow)"/>
      <path d="M45 22 L65 30 V50 C65 62 45 70 45 70 C45 70 25 62 25 50 V30 Z" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="45" cy="45" r="6" fill="#ef4444"/>
    </g>

    <!-- Main Title -->
    <text x="120" y="65" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5" fill="url(#title-grad)">garak</text>
    <text x="120" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="500" fill="#a89aab">Generative AI Red-Teaming &amp; Assessment Kit — LLM Vulnerability Scanner</text>

    <!-- Tags Row -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#1c0f18" stroke="#ef4444" stroke-width="1.2"/>
      <text x="82" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#f87171">🛡️ PROMPT INJECTION</text>

      <rect x="180" y="0" width="135" height="38" rx="8" fill="#1c0f18" stroke="#f97316" stroke-width="1.2"/>
      <text x="247" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#fb923c">🔓 JAILBREAKS</text>

      <rect x="330" y="0" width="145" height="38" rx="8" fill="#1c0f18" stroke="#eab308" stroke-width="1.2"/>
      <text x="402" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#facc15">🔎 DATA LEAKAGE</text>

      <rect x="490" y="0" width="155" height="38" rx="8" fill="#1c0f18" stroke="#c084fc" stroke-width="1.2"/>
      <text x="567" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#d8b4fe">🧠 HALLUCINATIONS</text>

      <rect x="660" y="0" width="155" height="38" rx="8" fill="#1c0f18" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="737" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#7dd3fc">⚡ ADAPTIVE PROBES</text>
    </g>

    <!-- Author Badge -->
    <g transform="translate(0, 220)">
      <line x1="0" y1="0" x2="1160" y2="0" stroke="#261b24" stroke-width="1.5"/>
      <text x="0" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#715c6d">MAINTAINED &amp; CURATED BY <tspan fill="#f5d0fe" font-weight="700">RAUF ZEN</tspan> (@raufzen)</text>
      <text x="1160" y="28" text-anchor="end" font-family="monospace" font-size="13" fill="#715c6d">APACHE 2.0 LICENSE · OPEN SOURCE</text>
    </g>
  </g>
</svg>